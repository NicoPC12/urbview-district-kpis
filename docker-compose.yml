# Local development stack. `docker compose up --build` must work on a clean clone with no
# prior steps, so local-only credentials have inline defaults (see README "Configuration").
# Anything set in the environment or in a repo-root .env overrides them.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbview}
      POSTGRES_USER: ${POSTGRES_USER:-urbview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbview_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Deliberately NOT published to the host: only `backend` talks to Postgres, over the
    # compose network. A host binding would buy nothing and would fail `docker compose up`
    # on any machine that already runs Postgres or another stack on 5432 — the first
    # command of the documented setup. Reach it with `docker compose exec db psql …`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbview} -d ${POSTGRES_DB:-urbview}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ADMIN_USERNAME: ${DJANGO_ADMIN_USERNAME:-admin}
      DJANGO_ADMIN_PASSWORD: ${DJANGO_ADMIN_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-urbview}
      POSTGRES_USER: ${POSTGRES_USER:-urbview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbview_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      WAREHOUSE_PATH: /data/warehouse.duckdb
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
